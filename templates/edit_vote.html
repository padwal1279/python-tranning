{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-center mb-4">Edit Vote</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Voter Name</label>
            <input type="text" name="voter_name" class="form-control"
                   value="{{ voter.voter_name }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Voter ID</label>
            <input type="text" name="voter_id" class="form-control"
                   value="{{ voter.voter_id }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Candidate</label>
            <input type="text" name="candidate" class="form-control"
                   value="{{ voter.candidate }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">City</label>
            <input type="text" name="city" class="form-control"
                   value="{{ voter.city }}" required>
        </div>

        <button type="submit" class="btn btn-success">
            Update Vote
        </button>

        <a href="{{ url_for('records') }}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
