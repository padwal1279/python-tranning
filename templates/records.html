{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-center mb-4">Voter Records</h2>
    <form method="GET" action="{{ url_for('records') }}" class="mb-4">
    <div class="input-group">
        <input type="text"
               name="search"
               class="form-control"
               placeholder="Search by Voter Name or Voter ID"
               value="{{ search }}">
        <button type="submit" class="btn btn-primary">
            Search
        </button>
    </div>
</form>

    <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover text-center">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Voter Name</th>
                    <th>Voter ID</th>
                    <th>Candidate</th>
                    <th>City</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for voter in voters %}
                <tr>
                    <td>{{ voter.id }}</td>
                    <td>{{ voter.voter_name }}</td>
                    <td>{{ voter.voter_id }}</td>
                    <td>{{ voter.candidate }}</td>
                    <td>{{ voter.city }}</td>
                    <td>
    <a href="{{ url_for('edit_vote', voter_id=voter.id) }}"
       class="btn btn-warning btn-sm">
        Edit
    </a>

    <a href="{{ url_for('delete_vote', voter_id=voter.id) }}"
       class="btn btn-danger btn-sm">
        Delete
    </a>
</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

{% endblock %}
