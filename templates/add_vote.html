{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <!-- Form Card -->
            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white text-center py-3">
                    <h3 class="mb-0">🗳️ Add Vote</h3>
                </div>

                <div class="card-body p-4">

                    <p class="text-muted text-center mb-4">
                        Enter voter information carefully.
                    </p>

                    <form method="POST">

                        <!-- Voter Name -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Voter Name
                            </label>

                            <input type="text"
                                   name="voter_name"
                                   class="form-control"
                                   placeholder="Enter voter name"
                                   required>
                        </div>


                        <!-- Voter ID -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Voter ID
                            </label>

                            <input type="text"
                                   name="voter_id"
                                   class="form-control"
                                   placeholder="Enter voter ID"
                                   required>
                        </div>


                        <!-- Candidate -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Candidate Name
                            </label>

                            <input type="text"
                                   name="candidate"
                                   class="form-control"
                                   placeholder="Enter candidate name"
                                   required>
                        </div>


                        <!-- City -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                City
                            </label>

                            <input type="text"
                                   name="city"
                                   class="form-control"
                                   placeholder="Enter city"
                                   required>
                        </div>


                        <!-- Buttons -->
                        <div class="d-grid gap-2">

                            <button type="submit"
                                    class="btn btn-primary btn-lg">
                                🗳️ Submit Vote
                            </button>

                            <a href="{{ url_for('records') }}"
                               class="btn btn-outline-secondary">
                                📋 View Records
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
